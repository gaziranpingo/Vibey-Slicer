<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2330" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Rect Background with slight gradient and subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Printer Icon Artwork (Centered, scaled with glowing gradient) -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#glow)" stroke="url(#iconGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Nozzle / Extruder Assembly -->
    <path d="M 128 40 L 384 40 L 300 160 L 300 240 L 256 300 L 212 240 L 212 160 Z" />
    <line x1="256" y1="300" x2="256" y2="350" stroke-width="26" />
    
    <!-- Build Layers Stack -->
    <path d="M 90 400 Q 256 370 422 400" stroke-width="22" />
    <path d="M 120 440 Q 256 410 392 440" stroke-width="22" />
  </g>
</svg>
